<mat-sidenav-container class="container">
    <mat-sidenav #sidenav class="sidenav" mode="side" fixedInViewport="true" fixedTopGap="64">
        <mat-nav-list class="nav-list">
            <a mat-list-item routerLink="/" routerLinkActive="router-link-active">
                <i class="material-icons">
                    home
                </i>
                Início
            </a>
            <a mat-list-item routerLink="/fcliente" routerLinkActive="router-link-active">
                <i class="material-icons">
                    person
                </i>
                Cliente
            </a>

            <a mat-list-item routerLink="/fpagamentos" routerLinkActive="router-link-active">
                <i class="material-icons">
                    credit_card
                </i>
                Forma de Pagamento
            </a>

            <a mat-list-item routerLink="/fproduto" routerLinkActive="router-link-active">
                <i class="material-icons">
                    storefront
                </i>
                Produto
            </a>







        </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content class="content">
        <!-- usamos para começar a trabalhar com a navegação a partir do clique... -->
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
