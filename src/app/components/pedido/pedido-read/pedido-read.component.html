<div class="mat-elevation-z4">
  <table mat-table [dataSource]="pedidos" class="full-width-table">

    <!-- ID -->
    <ng-container matColumnDef="pedId">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.pedId }}</td>
    </ng-container>

    <!-- Cliente -->
    <ng-container matColumnDef="cliente">
      <th mat-header-cell *matHeaderCellDef>Cliente</th>
      <td mat-cell *matCellDef="let row">{{ getClienteNome(row) }}</td>
    </ng-container>

    <!-- Data do Pedido -->
    <ng-container matColumnDef="pedData">
      <th mat-header-cell *matHeaderCellDef>Data do Pedido</th>
      <td mat-cell *matCellDef="let row">{{ row.pedData | date: 'dd/MM/yyyy' }}</td>
    </ng-container>

    <!-- Valor Total -->
    <ng-container matColumnDef="pedValorTotal">
      <th mat-header-cell *matHeaderCellDef>Valor Total</th>
      <td mat-cell *matCellDef="let row">{{ row.pedValorTotal | currency: 'BRL' }}</td>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="pedStatus">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">{{ row.pedStatus || 'Pendente' }}</td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>AÇÕES</th>
      <td mat-cell *matCellDef="let row">
        <a routerLink="/fpedido/delete/{{ row.pedId }}" class="delete">
          <i class="material-icons">delete</i>
        </a>
      </td>
    </ng-container>

    <!-- Cabeçalho e linhas -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</div>
