<div class="mat-elevation-z4">
  <!-- Campo de busca -->
  <div style="padding: 16px;">
    <mat-form-field appearance="fill" style="width: 100%;">
      <mat-label>Buscar formas de pagamento</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Digite para buscar por descrição, tipo, ID..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <!-- Indicador de carregamento -->
  <div *ngIf="loading" style="text-align: center; padding: 20px;">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Carregando formas de pagamento...</p>
  </div>

  <!-- Tabela -->
  <table mat-table [dataSource]="dataSource" class="full-width-table" matSort>
  
      <!-- ID -->
      <ng-container matColumnDef="formId">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.formId }}</td>
      </ng-container>
  
      <!-- DESCRIÇÃO -->
      <ng-container matColumnDef="formDescricao">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="formDescricao">DESCRIÇÃO</th>
        <td mat-cell *matCellDef="let row">{{ row.formDescricao }}</td>
      </ng-container>
  
      <!-- TIPO -->
      <ng-container matColumnDef="formTipo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="formTipo">TIPO</th>
        <td mat-cell *matCellDef="let row">{{ row.formTipo }}</td>
      </ng-container>
  
      <!-- Ativo -->
      <ng-container matColumnDef="formAtivo">
        <th mat-header-cell *matHeaderCellDef>ATIVO</th>
        <td mat-cell *matCellDef="let row">
          <mat-icon *ngIf="row.formAtivo === 'true' || row.formAtivo === true" color="primary">check_circle</mat-icon>
          <mat-icon *ngIf="row.formAtivo !== 'true' && row.formAtivo !== true" color="warn">cancel</mat-icon>
        </td>
      </ng-container>
  
      <!-- Ações -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>AÇÕES</th>
        <td mat-cell *matCellDef="let row">
          <a routerLink="/fpagamentos/update/{{ row.formId }}" class="edit" matTooltip="Editar forma de pagamento">
            <i class="material-icons">edit</i>
          </a>
          <a routerLink="/fpagamentos/delete/{{ row.formId }}" class="delete" style="margin-left: 8px;" matTooltip="Excluir forma de pagamento">
            <i class="material-icons">delete</i>
          </a>
        </td>
      </ng-container>
  
      <!-- Cabeçalho e linhas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Mensagem quando não há dados -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          Nenhuma forma de pagamento encontrada.
        </td>
      </tr>
    </table>

    <!-- Paginação -->
    <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons></mat-paginator>
  </div>
