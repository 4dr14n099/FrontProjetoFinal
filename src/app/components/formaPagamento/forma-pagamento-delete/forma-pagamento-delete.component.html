<mat-card>
  <mat-card-title>Excluir Forma de Pagamento</mat-card-title>

  <mat-card-content>
    <p>Tem certeza que deseja excluir a forma de pagamento abaixo?</p>
    
    <div style="margin: 20px 0;">
      <p><strong>Descrição:</strong> {{ formapagamento.formDescricao }}</p>
      <p><strong>Tipo:</strong> {{ formapagamento.formTipo }}</p>
      <p *ngIf="formapagamento.formTaxaPercentual"><strong>Taxa:</strong> {{ formapagamento.formTaxaPercentual }}%</p>
    </div>
  </mat-card-content>

  <mat-card-actions>
    <button mat-raised-button color="warn" (click)="deleteFormaPagamento()">
      Excluir
    </button>
    <button mat-raised-button (click)="cancel()" style="margin-left: 8px;">
      Cancelar
    </button>
  </mat-card-actions>
</mat-card>
