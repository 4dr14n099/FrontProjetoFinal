<mat-card>
  <mat-card-title>Excluir Produto</mat-card-title>

  <!-- Indicador de carregamento -->
  <div *ngIf="loading" style="text-align: center; padding: 40px;">
    <mat-spinner diameter="50"></mat-spinner>
    <p style="margin-top: 16px;">Carregando...</p>
  </div>

  <mat-card-content *ngIf="!loading">
    <p>Tem certeza que deseja excluir o produto abaixo?</p>
    
    <div style="margin: 20px 0;">
      <p><strong>Nome:</strong> {{ produto.proNome }}</p>
      <p *ngIf="produto.proDescricao"><strong>Descrição:</strong> {{ produto.proDescricao }}</p>
      <p *ngIf="produto.proPrecoVenda"><strong>Preço de Venda:</strong> {{ produto.proPrecoVenda | currency: 'BRL' }}</p>
    </div>
  </mat-card-content>

  <mat-card-actions *ngIf="!loading">
    <button mat-raised-button color="warn" (click)="deleteProduto()" [disabled]="loading" matTooltip="Excluir produto">
      Excluir
    </button>
    <button mat-raised-button (click)="cancel()" style="margin-left: 8px;" [disabled]="loading" matTooltip="Cancelar exclusão">
      Cancelar
    </button>
  </mat-card-actions>
</mat-card>
