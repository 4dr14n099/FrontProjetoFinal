<div class="mat-elevation-z4">
  <!-- Campo de busca -->
  <div style="padding: 16px;">
    <mat-form-field appearance="fill" style="width: 100%;">
      <mat-label>Buscar produtos</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Digite para buscar por nome, ID, preço..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <!-- Indicador de carregamento -->
  <div *ngIf="loading" style="text-align: center; padding: 20px;">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Carregando produtos...</p>
  </div>

  <!-- Tabela -->
  <table mat-table [dataSource]="dataSource" class="full-width-table" matSort>
      <!-- Id Column -->
      <ng-container matColumnDef="proId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="proId">ID</th>
        <td mat-cell *matCellDef="let row">{{row.proId}}</td>
      </ng-container>
 
      <!-- Name Column -->
      <ng-container matColumnDef="proNome">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="proNome">DESCRIÇÃO</th>
        <td mat-cell *matCellDef="let row">{{row.proNome}}</td>
      </ng-container>
 
      <!-- Price Column -->
      <ng-container matColumnDef="proPrecoCusto">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="proPrecoCusto">PREÇO DE CUSTO</th>
        <td mat-cell *matCellDef="let row">{{row.proPrecoCusto | currency: 'BRL'}}</td>
      </ng-container>

      <!-- Price Column -->
      <ng-container matColumnDef="proPrecoVenda">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="proPrecoVenda">PREÇO DE VENDA</th>
        <td mat-cell *matCellDef="let row">{{row.proPrecoVenda | currency: 'BRL'}}</td>
      </ng-container>

      <!-- Action Column -->
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>AÇÕES</th>                    
        <td mat-cell *matCellDef="let row">
            <a routerLink="/fproduto/update/{{ row.proId }}" class="edit" matTooltip="Editar produto">
                <i class="material-icons">edit</i>
            </a>
            <a routerLink="/fproduto/delete/{{ row.proId }}" class="delete" style="margin-left: 8px;" matTooltip="Excluir produto">
                <i class="material-icons">delete</i>
            </a>
        </td>
      </ng-container>
 
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <!-- Mensagem quando não há dados -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          Nenhum produto encontrado.
        </td>
      </tr>
    </table>

    <!-- Paginação -->
    <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons></mat-paginator>
  </div>
