<mat-card>
  <mat-card-title>Excluir Cliente</mat-card-title>

  <!-- Indicador de carregamento -->
  <div *ngIf="loading" style="text-align: center; padding: 40px;">
    <mat-spinner diameter="50"></mat-spinner>
    <p style="margin-top: 16px;">Carregando...</p>
  </div>

  <mat-card-content *ngIf="!loading">
    <p>Tem certeza que deseja excluir o cliente abaixo?</p>
    
    <div style="margin: 20px 0;">
      <p><strong>Nome:</strong> {{ cliente.cliNome }}</p>
      <p><strong>CPF:</strong> {{ cliente.cliCpf }}</p>
      <p *ngIf="cliente.cliRg"><strong>RG:</strong> {{ cliente.cliRg }}</p>
    </div>
  </mat-card-content>

  <mat-card-actions *ngIf="!loading">
    <button mat-raised-button color="warn" (click)="deleteCliente()" [disabled]="loading" matTooltip="Excluir cliente">
      Excluir
    </button>
    <button mat-raised-button (click)="cancel()" style="margin-left: 8px;" [disabled]="loading" matTooltip="Cancelar exclusão">
      Cancelar
    </button>
  </mat-card-actions>
</mat-card>
