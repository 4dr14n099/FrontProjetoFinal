<div class="mat-elevation-z4">
  <!-- Campo de busca -->
  <div style="padding: 16px;">
    <mat-form-field appearance="fill" style="width: 100%;">
      <mat-label>Buscar clientes</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Digite para buscar por nome, CPF, ID..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <!-- Indicador de carregamento -->
  <div *ngIf="loading" style="text-align: center; padding: 20px;">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Carregando clientes...</p>
  </div>

  <!-- Tabela -->
  <table mat-table [dataSource]="dataSource" class="full-width-table" matSort>

    <!-- ID -->
    <ng-container matColumnDef="cliId">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.cliId }}</td>
    </ng-container>

    <!-- Nome -->
    <ng-container matColumnDef="cliNome">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="cliNome">Nome</th>
      <td mat-cell *matCellDef="let row">{{ row.cliNome }}</td>
    </ng-container>

    <!-- CPF -->
    <ng-container matColumnDef="cliCpf">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="cliCpf">CPF</th>
      <td mat-cell *matCellDef="let row">{{ formatarCPF(row.cliCpf) }}</td>
    </ng-container>

    <!-- RG -->
    <ng-container matColumnDef="cliRg">
      <th mat-header-cell *matHeaderCellDef>RG</th>
      <td mat-cell *matCellDef="let row">{{ row.cliRg }}</td>
    </ng-container>

    <!-- Ativo -->
    <ng-container matColumnDef="cliAtivo">
      <th mat-header-cell *matHeaderCellDef>ATIVO</th>
      <td mat-cell *matCellDef="let row">
        <!-- Backend retorna como String, então verificamos string 'true' (minúscula) ou boolean true -->
        <mat-icon *ngIf="isAtivoCliente(row.cliAtivo)" color="primary">check_circle</mat-icon>
        <mat-icon *ngIf="!isAtivoCliente(row.cliAtivo)" color="warn">cancel</mat-icon>
      </td>
    </ng-container>

    <!-- Ações -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef>AÇÕES</th>
      <td mat-cell *matCellDef="let row">
        <a routerLink="/fcliente/update/{{ row.cliId }}" class="edit" matTooltip="Editar cliente">
          <i class="material-icons">edit</i>
        </a>
        <a routerLink="/fcliente/delete/{{ row.cliId }}" class="delete" style="margin-left: 8px;" matTooltip="Excluir cliente">
          <i class="material-icons">delete</i>
        </a>
      </td>
    </ng-container>

    <!-- Cabeçalho e linhas -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Mensagem quando não há dados -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">
        Nenhum cliente encontrado.
      </td>
    </tr>
  </table>

  <!-- Paginação -->
  <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons></mat-paginator>
</div>
