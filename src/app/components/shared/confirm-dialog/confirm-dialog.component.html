<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" color="primary">
    {{ data.cancelText }}
  </button>
  <button mat-raised-button (click)="onConfirm()" color="warn">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
